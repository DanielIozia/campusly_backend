<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${emailTitle}">Email Campusly</title>
    <style>
        /* BRAND COLORS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: transparent;
            color: #1A1A2E;
        }

        .wrapper {
            max-width: 600px;
            margin: 40px auto;
            background-color: #f8f5ff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #E5E7EB;
        }

        /* Header */
        .header {
            background-color: #5843d0;
            padding: 32px 40px;
            text-align: center;
        }

        .header .logo-text {
            font-weight: 900;
            font-style: italic;
            font-size: 1.5rem;
            letter-spacing: -0.04em;
            color: #ffffff;
            text-decoration: none;
        }

        /* Body */
        .content {
            padding: 40px;
        }

        .content h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1A1A2E;
            margin-bottom: 16px;
        }

        .content .body-text {
            font-size: 15px;
            line-height: 1.7;
            color: #1A1A2E;
        }

        /* Footer */
        .footer {
            background-color: #ece6f8;
            padding: 24px 40px;
            text-align: center;
            border-top: 1px solid #E5E7EB;
        }

        .footer p {
            font-size: 12px;
            color: #6B7280;
            line-height: 1.6;
        }

        .footer a {
            color: #5843d0;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="wrapper">

        <!-- ── HEADER ── -->
        <div class="header">
            <div class="logo-text">Campusly</div>
        </div>

        <!-- ── CONTENT ── -->
        <div class="content">
            <h1 th:text="${emailTitle}">Titolo email</h1>
            <div class="body-text" th:utext="${emailBody}">
                Corpo dell'email.
            </div>
        </div>

        <!-- ── FOOTER ── -->
        <div class="footer">
            <p>
                Non hai richiesto questa email? Contatta il supporto tecnico 
                <br>
                <a href="mailto:campusly.doc@hotmail.com">campusly.doc@hotmail.com</a>.
            </p>
            <p style="margin-top: 12px;">
                &copy; 2025 Campusly · Tutti i diritti riservati
            </p>
        </div>

    </div>
</body>

</html>
