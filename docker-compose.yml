# ============================================================
# docker-compose.yml — PRODUZIONE (VPS + Traefik)
# Uso: docker compose up -d
# Richiede: .env.prod nella stessa directory
# ============================================================

services:

  # ── Backend Spring Boot ──────────────────────────────────────
  backend:
    image: ${DOCKER_IMAGE:-ghcr.io/campusly/campusly-backend}:${IMAGE_TAG:-latest}
    container_name: campusly-backend-prod
    restart: always
    env_file: .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH2_FRONTEND_REDIRECT: ${OAUTH2_FRONTEND_REDIRECT}
      DOMAIN: ${DOMAIN}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    networks:
      - campusly-internal
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.campusly-api.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.campusly-api.entrypoints=websecure"
      - "traefik.http.routers.campusly-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.campusly-api.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik"

networks:
  campusly-internal:
    driver: bridge
    name: campusly-internal
  traefik:
    external: true
    name: traefik