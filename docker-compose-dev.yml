# ============================================================
# docker-compose-dev.yml — AMBIENTE DEV (DB remoto condiviso)
# Uso: docker compose -f docker-compose-dev.yml up --build
# Richiede: .env.dev nella stessa directory
# ============================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: campusly-backend:dev
    container_name: campusly-backend-dev
    restart: unless-stopped
    env_file: .env.dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH2_FRONTEND_REDIRECT: ${OAUTH2_FRONTEND_REDIRECT}
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - campusly-dev

networks:
  campusly-dev:
    driver: bridge
    name: campusly-dev