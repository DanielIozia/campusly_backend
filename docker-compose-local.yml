# ============================================================
# docker-compose-local.yml — SVILUPPO LOCALE
# Uso: docker compose -f docker-compose-local.yml up --build
# Richiede: .env.local nella stessa directory
# ============================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: campusly-backend:local
    container_name: campusly-backend-local
    restart: unless-stopped
    env_file: .env.local
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH2_FRONTEND_REDIRECT: ${OAUTH2_FRONTEND_REDIRECT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - campusly-uploads:/app/uploads
    networks:
      - campusly-local

volumes:
  campusly-uploads:

networks:
  campusly-local:
    driver: bridge
    name: campusly-local